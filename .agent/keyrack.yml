org: ehmpathy
extends:
  - .agent/repo=bhrain/role=reviewer/keyrack.yml
  - .agent/repo=bhuild/role=dispatcher/keyrack.yml
  - .agent/repo=ehmpathy/role=mechanic/keyrack.yml
  # .note = no extend of .agent/repo=mhedic/role=diagnostician/keyrack.yml — that path is a
  #         GITIGNORED build artifact, absent in ci, so the extend fails there. it also
  #         declares zero keys, so the extend bought naught. declare this repo's own keys
  #         directly below.
env.all: null
env.prod: null
env.prep:
  - EHMPATHY_SEATURTLE_PROD_GITHUB_TOKEN
env.test:
  - GOOGLE_CLOUD_RHIGHT_SERVICE_ACCOUNT_CREDS
  # .what = the anthropic api key the peer-review lane needs
  # .why  = the route guard runs `rhx review` on brain `claude/sonnet`, which the
  #         anthropic sdk authenticates via apiKey / authToken. the vault holds
  #         BRAINS_AUTH__OF__CLAUDE_CODE_OAUTH_TOKEN, which that sdk path does not read,
  #         and no manifest in this repo declared an anthropic key — so every peer lane
  #         on every stone returns `malfunction`.
  # .todo = a human fills it once: `rhx keyrack fill --owner ehmpath`
  #         (alternative: point the guard's lane at a `fireworks/*` brain, which the
  #          extant FIREWORKS_API_KEY already serves)
  - ANTHROPIC_API_KEY
